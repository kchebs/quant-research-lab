[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "1.1.0"
description = "Quant Research Lab: end-to-end DS/ML/AI research pipeline for equity markets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = []
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "yfinance>=0.2.40",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "jupytext>=1.16"]
abides = [
    "joblib>=1.3",
    "jsons>=1.6",
    "psutil>=5.9",
    "pprofile>=2.1",
    "tqdm>=4.66",
    "seaborn>=0.13",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
