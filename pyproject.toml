[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "1.1.0"
description = "Quant Research Lab: end-to-end DS/ML/AI research pipeline for equity markets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = []
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "yfinance>=0.2.40",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "jupytext>=1.16",
    "ruff>=0.6",
    "mypy>=1.11",
    # pandas-stubs>=3 adds Scalar/.loc union noise under mypy; omit for CI.
]
abides = [
    "joblib>=1.3",
    "jsons>=1.6",
    "psutil>=5.9",
    "pprofile>=2.1",
    "tqdm>=4.66",
    "seaborn>=0.13",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/quantlab"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
follow_imports = "skip"

# pandas-stubs (if installed in the IDE env) still injects Scalar/.loc noise at call sites.
[[tool.mypy.overrides]]
module = [
    "quantlab.backtest.engine",
    "quantlab.rl.env",
    "quantlab.strategies.ml_strategy",
]
disable_error_code = ["call-overload", "arg-type"]
